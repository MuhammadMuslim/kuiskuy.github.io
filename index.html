<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Keamanan dan Perlindungan Data Kesehatan Quiz</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{--bg:#46178F;--bg2:#2D0C66;--card:#FFFFFF;--ink:#1F1F2E;--mut:#6B6B80;--pri:#46178F;--priT:#FFFFFF;--soft:#EEE6FA;--ok:#26890C;--okB:#DFF3D8;--bad:#E21B3C;--badB:#FCE0E5;--line:#D9D2E9;--c0:#E21B3C;--c1:#1368CE;--c2:#D89E00;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--card:#241447;--ink:#F1EAFF;--mut:#B7A9D9;--pri:#B58CFF;--priT:#1B0C3A;--soft:#33205F;--okB:#17381A;--badB:#431B26;--line:#46327A;color-scheme:dark}}
html,body{margin:0;background:linear-gradient(160deg,var(--bg),var(--bg2));background-attachment:fixed;min-height:100%;color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,sans-serif;font-size:17px;line-height:1.5}
h1,h2,h3{font-family:"Bricolage Grotesque",system-ui,sans-serif;margin:0;line-height:1.15}
main{max-width:640px;margin:0 auto;padding:16px 16px 48px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px;color:#fff}
.pill{background:rgba(255,255,255,.16);border-radius:999px;padding:6px 14px;font-weight:700;white-space:nowrap}
.pill b{font-family:"Bricolage Grotesque",sans-serif;font-size:1.15rem}
.sp{flex:1}
.card{background:var(--card);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.hero{text-align:center;background:transparent;box-shadow:none;color:#fff;padding:8px 0 4px}
.hero h1{font-size:2.1rem;margin-bottom:6px}
.hero p{margin:0;opacity:.85}
.logo{font-size:3rem}
.lv{display:flex;gap:14px;align-items:center;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
.lv:disabled{opacity:.45;cursor:not-allowed}
.lv b{font-family:"Bricolage Grotesque",sans-serif;font-size:1.4rem;color:var(--priT);background:var(--pri);width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none}
.lv span{display:block;color:var(--mut);font-size:.92rem}
.stars{margin-left:auto;letter-spacing:2px;color:#E8A317;white-space:nowrap;font-weight:700}
.tb{height:12px;background:rgba(255,255,255,.2);border-radius:8px;overflow:hidden}
.tb i{display:block;height:100%;width:100%;background:#FFD23F;transition:width .1s linear}
.tb.low i{background:#FF5A5F}
.q{background:var(--card);border-radius:16px;padding:20px;text-align:center;box-shadow:0 4px 0 rgba(0,0,0,.18);margin:12px 0}
.q h2{font-size:1.35rem}
.prog{color:#fff;opacity:.9;font-size:.92rem;display:flex;justify-content:space-between;margin-bottom:6px}
.ans{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;font-weight:700;color:#fff;border:0;border-radius:12px;padding:16px 14px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.28);transition:transform .08s}
.opt:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.28)}
.opt i{font-style:normal;font-size:1.3rem;width:26px;text-align:center;flex:none}
.c0{background:var(--c0)}.c1{background:var(--c1)}.c2{background:var(--c2)}
.opt:disabled{cursor:default}
.opt.dim{opacity:.3}
.opt.ok{outline:4px solid #fff;box-shadow:0 0 0 7px var(--ok)}
.btn{font:inherit;font-weight:700;background:#fff;color:var(--bg);border:0;border-radius:12px;padding:13px 22px;margin-top:14px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.card .btn{background:var(--pri);color:var(--priT)}
.btn.ghost{background:transparent;color:var(--pri);box-shadow:inset 0 0 0 2px var(--pri)}
.btn.ghost.w{color:#fff;box-shadow:inset 0 0 0 2px #fff}
.opt:focus-visible,.btn:focus-visible,.lv:focus-visible{outline:3px solid #FFD23F;outline-offset:2px}
.res{border-radius:16px;padding:16px;margin-top:12px;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.res.good{background:var(--ok)}.res.no{background:var(--bad)}
.res h3{font-size:1.4rem;margin-bottom:4px}
.res p{margin:4px 0 0}
.res .btn{margin-top:12px}
.lg{background:var(--card);border-radius:16px;padding:12px;margin:12px 0;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.log{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.86rem;display:grid;gap:8px}
.log .opt{background:var(--soft);color:var(--ink);box-shadow:none;font-weight:400;padding:10px 12px}
.log .opt.sel{background:var(--c1);color:#fff;font-weight:700}
.log .opt.ok{background:var(--ok);color:#fff;outline:none;box-shadow:none}
.log .opt.bad{background:var(--bad);color:#fff;outline:none;box-shadow:none}
.big{font-family:"Bricolage Grotesque",sans-serif;font-size:2.6rem;font-weight:800;color:var(--pri)}
.center{text-align:center}
input{display:block;width:100%;box-sizing:border-box;font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:10px;padding:12px;margin-top:10px}
textarea{width:100%;box-sizing:border-box;font:.8rem ui-monospace,Menlo,Consolas,monospace;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:10px;padding:10px;word-break:break-all}
input:focus-visible,textarea:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.tw{overflow-x:auto;margin-top:12px}table{border-collapse:collapse;width:100%;font-size:.9rem}th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;white-space:nowrap}
.card p{color:var(--ink)}
.pop{animation:pop .35s}
@keyframes pop{0%{transform:scale(.8);opacity:0}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.pop{animation:none}.tb i{transition:none}}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px;color:#fff}
.bar h1{font-size:1.5rem;margin-right:auto}
.bar .btn{margin-top:0;padding:9px 16px}
.btn.on,.card .btn.on{background:#FFD23F;color:#1F1F2E}
.live{color:var(--ok);font-weight:700}.mut{color:var(--mut)}
.err{color:#FFB3C0;margin-top:10px}
.lb{display:grid;grid-template-columns:1fr 220px;gap:20px;align-items:start;color:#fff}
.lb h2{font-size:2rem;margin-bottom:12px}
.rw{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;margin-bottom:10px;font-size:1.25rem}
.rw .rk{font-family:"Bricolage Grotesque",sans-serif;font-size:1.6rem;text-align:center}
.rw .tr{height:10px;background:rgba(255,255,255,.2);border-radius:6px;margin-top:4px;overflow:hidden}
.rw .tr i{display:block;height:100%;background:#FFD23F;transition:width .6s}
.rw b{font-family:"Bricolage Grotesque",sans-serif;font-size:1.5rem}
.rw small{opacity:.75;font-size:.8rem;margin-left:8px}
.qb{background:#fff;color:#1F1F2E;border-radius:14px;padding:12px;text-align:center;font-size:.9rem}
.qb svg{width:100%;height:auto}
.mt h2{margin-bottom:10px}.mt p,.mt li{margin:8px 0}.mt ul{padding-left:20px;margin:8px 0}.mt .box{background:var(--soft);border-radius:10px;padding:10px 12px;margin:10px 0}
@media (max-width:700px){.lb{grid-template-columns:1fr}.rw{font-size:1rem}}
.fig{margin:12px 0;text-align:center}.fig svg{width:100%;max-width:420px;height:auto}.fig small{display:block;color:var(--mut);font-size:.85rem;margin-top:2px}
.fig text{fill:var(--ink);font:600 12px system-ui,sans-serif}.fig text.b1,.fig text.b2,.fig text.b3,.fig text.b4{fill:#fff}.fig text.m{font:11px ui-monospace,Menlo,monospace;fill:#fff;font-weight:400}
.fig .b0{fill:var(--soft);stroke:var(--pri);stroke-width:1.5}.fig .b1{fill:var(--c1)}.fig .b2{fill:var(--c0)}.fig .b3{fill:var(--ok)}.fig .b4{fill:#B07A00}
.fig .ln{stroke:var(--mut);stroke-width:2;fill:none}.fig circle{fill:var(--pri)}
.ex{border-left:5px solid var(--c2);background:var(--soft);border-radius:10px;padding:10px 12px;margin:12px 0}
.mt .ok2{list-style:none;padding-left:0}.mt .ok2 li{margin:6px 0}
.rq{border-left:5px solid var(--ok);padding:2px 0 2px 10px;margin:16px 0}.rq.no{border-color:var(--c0)}.rq .a{margin:4px 0}
.rq details{margin-top:8px;background:var(--soft);border-radius:10px;padding:8px 10px}.rq summary{cursor:pointer;font-weight:700}
.rv-f{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.rb{display:inline-block;height:8px;background:var(--c0);border-radius:4px;vertical-align:middle;margin:0 6px}.rb.ok{background:var(--ok)}
.ed textarea{font:inherit;word-break:normal;min-height:72px;margin-top:10px}
.ed label{display:flex;gap:10px;align-items:center;margin-top:8px}
.ed label input[type=radio]{width:24px;height:24px;margin:0;flex:none;accent-color:var(--pri)}
.ed label input[type=text]{margin:0;flex:1;width:auto}
.pz{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pz>div{display:flex;flex-direction:column;gap:8px}.pzw .opt{background:var(--soft);color:var(--ink);box-shadow:none;font-weight:600;padding:12px;margin-top:8px}.pz .opt{margin-top:0}.pzw .opt.sel{background:var(--c1);color:#fff}.pzw .opt.ok{background:var(--ok);color:#fff;outline:none;box-shadow:none}.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.tiles .opt{width:auto;min-width:48px;justify-content:center;margin:0;font-size:1.3rem}.pzw .opt i{color:inherit}

.avg{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px;margin:6px 0}.avg button{font-size:1.6rem;line-height:1;padding:7px 0;border-radius:12px;border:2px solid var(--line);background:var(--card);cursor:pointer}.avg button.on{border-color:var(--pri);background:var(--soft)}.avg button:disabled{opacity:.5;cursor:default}.avi{width:1.3em;height:1.3em;vertical-align:-.28em;border-radius:50%;background:var(--soft)}.avg img{width:100%;max-width:40px;display:block;margin:auto;border-radius:50%}.avt{font-size:.8rem;font-weight:700;color:var(--mut);margin-top:6px}
.ov{position:fixed;inset:0;z-index:60;background:rgba(20,8,45,.85);display:grid;place-items:center;padding:16px}.ov>div{background:var(--card);color:var(--ink);border-radius:18px;padding:22px;max-width:440px;width:100%;max-height:86vh;overflow:auto;text-align:left}.ov h2{margin:0 0 10px}.ov li{margin:6px 0}.ov .btn{margin-top:12px}
/* ===== Halaman awal animasi KuisKuy ===== */
.ks{position:relative;min-height:72vh;display:grid;place-items:center;text-align:center;color:#fff;overflow:hidden}
.ks-bg{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.ks-bg span{position:absolute;bottom:-12%;left:var(--x);font-size:var(--s);opacity:0;color:#fff;animation:ksUp var(--dur) linear var(--d) infinite}
@keyframes ksUp{0%{transform:translateY(0) rotate(0);opacity:0}12%{opacity:.22}88%{opacity:.22}100%{transform:translateY(-95vh) rotate(300deg);opacity:0}}
.ks-c{position:relative;z-index:1;padding:24px 8px}
.ks-t{display:flex;justify-content:center;gap:6px;margin:0 0 14px}
.ks-t b{display:grid;place-items:center;width:clamp(40px,11.5vw,56px);height:clamp(48px,13.5vw,66px);border-radius:12px;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:clamp(1.7rem,7vw,2.4rem);font-weight:800;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.28);opacity:0;animation:ksDrop .7s cubic-bezier(.3,1.5,.5,1) calc(var(--i)*.09s + .15s) forwards,ksWave 2.6s ease-in-out calc(var(--i)*.14s + 1.2s) infinite}
.ks-t b:nth-child(4n+1){background:var(--c0)}.ks-t b:nth-child(4n+2){background:var(--c1)}.ks-t b:nth-child(4n+3){background:var(--c2)}.ks-t b:nth-child(4n+4){background:var(--ok)}
@keyframes ksDrop{0%{transform:translateY(-120px) rotate(-18deg) scale(.6);opacity:0}100%{transform:none;opacity:1}}
@keyframes ksWave{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px) rotate(-2deg)}}
.ks-sh{display:flex;justify-content:center;gap:16px;font-size:2rem;margin-bottom:18px;animation:ksFade .6s ease .1s both}
.ks-sh i{font-style:normal;display:inline-block;animation:ksSpin 3.2s ease-in-out infinite}
.ks-sh i:nth-child(1){color:#FF5A6E}.ks-sh i:nth-child(2){color:#5AA2FF;animation-delay:.25s}.ks-sh i:nth-child(3){color:#FFD23F;animation-delay:.5s}
@keyframes ksSpin{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.35) rotate(180deg)}}
.ks-s{font-size:1.15rem;margin:0 0 22px;animation:ksFade .8s ease 1.1s both}
.ks-card{display:inline-block;max-width:360px;background:rgba(255,255,255,.14);border-radius:16px;padding:14px 18px;animation:ksFade .8s ease 1.5s both,ksPulse 2.4s ease-in-out 2.4s infinite}
.ks-card span{font-size:1.6rem;display:block;margin-bottom:4px}
.ks-dots{display:flex;justify-content:center;gap:8px;margin-top:22px;animation:ksFade .6s ease 1.9s both}
.ks-dots i{width:10px;height:10px;border-radius:50%;background:#FFD23F;animation:ksDot 1.2s ease-in-out infinite}
.ks-dots i:nth-child(2){animation-delay:.2s}.ks-dots i:nth-child(3){animation-delay:.4s}
@keyframes ksDot{0%,80%,100%{transform:scale(.6);opacity:.5}40%{transform:scale(1.2);opacity:1}}
@keyframes ksFade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes ksPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.35)}50%{box-shadow:0 0 0 12px rgba(255,255,255,0)}}

/* ===== Animasi tambahan halaman awal ===== */
.ks::before{content:"";position:absolute;inset:-20%;background:radial-gradient(circle at 25% 30%,rgba(226,27,60,.35),transparent 40%),radial-gradient(circle at 75% 25%,rgba(19,104,206,.4),transparent 42%),radial-gradient(circle at 55% 80%,rgba(216,158,0,.3),transparent 40%);filter:blur(30px);animation:ksAur 12s ease-in-out infinite alternate;pointer-events:none}
@keyframes ksAur{0%{transform:translate(-4%,-3%) rotate(0) scale(1)}100%{transform:translate(4%,3%) rotate(14deg) scale(1.15)}}
.ks-cf{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:2}
.ks-cf i{position:absolute;top:-24px;left:var(--x);width:var(--w);height:calc(var(--w)*1.5);background:var(--c);border-radius:2px;opacity:0;animation:ksCf var(--t) cubic-bezier(.3,.6,.5,1) var(--d) forwards}
@keyframes ksCf{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(95vh) translateX(var(--dx)) rotate(var(--r));opacity:0}}
.ks-st{position:absolute;inset:0;pointer-events:none}
.ks-st em{position:absolute;left:var(--x);top:var(--y);font-style:normal;font-size:var(--s);animation:ksTw 2.2s ease-in-out var(--d) infinite}
@keyframes ksTw{0%,100%{transform:scale(.4) rotate(0);opacity:.1}50%{transform:scale(1) rotate(90deg);opacity:.9}}
.ks-t b{cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none}
.ks-t b.hop{animation:ksHop .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes ksHop{0%{transform:none}35%{transform:translateY(-36px) rotate(-14deg) scale(1.2)}100%{transform:none}}
.ks-s{background:linear-gradient(90deg,#fff 0%,#FFD23F 25%,#fff 50%,#FFD23F 75%,#fff 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:ksFade .8s ease 1.1s both,ksSh 3.5s linear 2s infinite}
@keyframes ksSh{to{background-position:-200% 0}}
.ks-bar{width:min(220px,60%);height:8px;margin:18px auto 0;border-radius:6px;background:rgba(255,255,255,.18);overflow:hidden;animation:ksFade .6s ease 1.9s both}
.ks-bar i{display:block;height:100%;width:40%;border-radius:6px;background:linear-gradient(90deg,#E21B3C,#FFD23F,#26890C);animation:ksSlide 1.6s ease-in-out infinite}
@keyframes ksSlide{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
.ks-hint{font-size:.85rem;opacity:.75;margin-top:14px;animation:ksFade .8s ease 2.3s both}
.ks-go{display:inline-block;text-decoration:none;margin-top:18px;animation:ksFade .6s ease both,ksPulse 2.4s ease-in-out .6s infinite}
.ks-dev{text-align:center;color:#fff;opacity:.8;font-size:.9rem;margin:6px 0 0;animation:ksFade .8s ease 2.3s both}
.kj{max-width:360px;margin:18px auto 0;text-align:center;position:relative;z-index:3}
.kj p{margin:0 0 8px;font-weight:700}
.kj form{display:flex;gap:8px}
.kj input{margin:0;flex:1;min-width:0;text-align:center;text-transform:uppercase;letter-spacing:.25em;font-weight:700;font-size:1.2rem}
.kj .btn{margin-top:0;padding:12px 16px}
.kj .kjm{color:#FFB3C0;min-height:1.3em;margin-top:8px;font-size:.92rem}
.kcode{font-family:"Bricolage Grotesque",sans-serif;font-size:2.2rem;font-weight:800;letter-spacing:.2em;color:var(--pri);margin:4px 0}
.qb .kcode{color:#46178F;font-size:1.8rem}
/* ===== Podium akhir ===== */
.pod{position:fixed;inset:0;z-index:70;background:radial-gradient(circle at 50% 0,#6A2BC4,#2D0C66 70%);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;overflow:auto;text-align:center}
.pod h2{font-size:clamp(1.8rem,5vw,2.8rem);animation:ksFade .8s ease both}
.pod>p{margin:4px 0 0;opacity:.85;animation:ksFade .8s ease .2s both}
.pds{display:flex;align-items:flex-end;justify-content:center;gap:clamp(8px,2vw,20px);width:min(780px,100%);height:min(66vh,480px);margin-top:18px}
.pdc{flex:1;max-width:230px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;min-width:0}
.pdp{max-width:100%;margin-bottom:8px;opacity:0;transform:translateY(-40px) scale(.5);animation:pdIn .8s cubic-bezier(.3,1.6,.5,1) var(--pd) forwards}
.pdp .av{font-size:clamp(2.2rem,8vw,3.6rem);line-height:1.1}
.pdp .nm{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:clamp(1rem,3.4vw,1.5rem);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pdp .sc{font-weight:700;opacity:.9}
.pdc.r1 .pdp .nm{font-size:clamp(1.2rem,4.2vw,1.9rem);color:#FFD23F}
.pdc.r1 .pdp{position:relative;padding-top:clamp(2.4rem,8.5vw,4rem);animation:pdIn .9s cubic-bezier(.3,1.6,.5,1) var(--pd) forwards,pdGlow 2s ease-in-out 7.6s infinite}
.crown{position:absolute;left:50%;top:0;font-size:clamp(2.2rem,8.5vw,3.8rem);line-height:1;opacity:0;transform:translate(-50%,-300px) rotate(-35deg) scale(1.8);animation:crownDrop 1.1s cubic-bezier(.3,1.4,.5,1) 6.4s forwards;z-index:2}
.flash{position:absolute;left:50%;top:clamp(1.2rem,4vw,2rem);width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:radial-gradient(circle,#fff 0,rgba(255,226,122,.9) 35%,rgba(255,210,63,0) 70%);opacity:0;pointer-events:none;animation:crownFlash 1.1s ease-out 7.3s forwards}
@keyframes crownDrop{0%{opacity:0;transform:translate(-50%,-300px) rotate(-35deg) scale(1.8)}15%{opacity:1}70%{transform:translate(-50%,6px) rotate(6deg) scale(.95)}100%{opacity:1;transform:translate(-50%,0) rotate(0) scale(1)}}
@keyframes crownFlash{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(34)}}
.pdb{width:100%;height:0;border-radius:14px 14px 0 0;display:flex;justify-content:center;padding-top:10px;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:clamp(2.2rem,8vw,3.8rem);color:#1F1F2E;box-shadow:0 -4px 0 rgba(255,255,255,.25) inset;animation:pdUp .9s cubic-bezier(.2,.9,.3,1) var(--bd) forwards}
.pdp,.pdb{flex:none}
.r1 .pdb{background:linear-gradient(#FFE27A,#E8A317);--h:54%}.r2 .pdb{background:linear-gradient(#E6EAF0,#A9B0BC);--h:38%}.r3 .pdb{background:linear-gradient(#E6A56B,#A65F25);--h:26%}
@keyframes pdUp{from{height:0}to{height:var(--h)}}
@keyframes pdIn{to{opacity:1;transform:none}}
@keyframes pdGlow{0%,100%{filter:drop-shadow(0 0 0 rgba(255,210,63,0))}50%{filter:drop-shadow(0 0 16px rgba(255,210,63,.9))}}
.pod .bar{margin:16px 0 0;justify-content:center;animation:ksFade .6s ease 8.6s both}
.pod .ks-cf i{animation-delay:calc(var(--d) + 7.3s)}

  const named=[...g.keys()].some(k=>k);let h="";
  g.forEach((rs,k)=>{h+=`<div class="bar">${named?`<b style="opacity:.9">📚 ${esc(k||"Tanpa mata kuliah")}</b>`:""}${rs.map(x=>`<button class="btn ${x.id===dRoom?"on":"ghost w"}" onclick="dRoom=ROOMS[${ROOMS.indexOf(x)}].id;bkFresh=1;dDraw()">${esc(x.ikon)} ${esc(x.nama)}${x.ar?" 🗄":""}</button>`).join("")}</div>`});
  return h+`<div class="bar"><button class="btn ghost w" onclick="rmNewTop()">＋ Kuis baru</button>${nAr?`<button class="btn ghost w" onclick="rmUi.ar=!rmUi.ar;dDraw()">${rmUi.ar?"Sembunyikan":"Tampilkan"} arsip (${nAr})</button>`:""}</div>`}
/* Rekap gabungan semua kuis dalam satu mata kuliah */
function dMk(){const rm=RM(),k=rm.mk||"",rs=ROOMS.filter(r=>k?r.mk===k:r.id===rm.id).filter(r=>!r.ar||r.id===rm.id||rmUi.ar),m={};
  rs.forEach((r,j)=>{dDocs.filter(d=>dRid(d)===r.id).forEach(d=>{const n=String(d.nim||"").trim();if(!n)return;const o=m[n]||(m[n]={nama:d.nama,nim:n,s:rs.map(()=>null)});if(o.s[j]==null||d.skor>o.s[j])o.s[j]=d.skor;if(d.nama)o.nama=d.nama})});
  const rows=Object.values(m).map(o=>({...o,tot:o.s.reduce((t,x)=>t+(x||0),0),n:o.s.filter(x=>x!=null).length})).sort((a,b)=>b.tot-a.tot),
  hd=rs.map(r=>r.nama+" (maks "+rMax(r)+")"),
  tsv=["Nama\tNIM\t"+hd.join("\t")+"\tTotal"].concat(rows.map(o=>[o.nama,o.nim,...o.s.map(x=>x==null?"":x),o.tot].join("\t"))).join("\n");
  return `<div class="card"><h2>${esc(k||rm.nama)}: rekap mata kuliah (${rows.length} mahasiswa, ${rs.length} kuis)</h2><p class="mut">${k?"Menggabungkan semua kamar dengan mata kuliah yang sama. ":"Kamar ini belum punya mata kuliah, jadi hanya satu kuis yang tampil. Isi kolom Mata kuliah lewat Bank soal, Ubah info kamar. "}Tiap kuis memakai skor tertinggi per NIM. Total adalah jumlah skor semua kuis.</p>`+
  (rows.length?`<div class="tw"><table><tr><th>#</th><th>Nama</th><th>NIM</th>${rs.map(r=>`<th>${esc(r.ikon)} ${esc(r.nama)}</th>`).join("")}<th>Total</th></tr>${rows.map((o,i)=>`<tr><td>${i+1}</td><td>${esc(o.nama)}</td><td>${esc(o.nim)}</td>${o.s.map(x=>`<td>${x==null?"–":x}</td>`).join("")}<td><b>${o.tot}</b></td></tr>`).join("")}</table></div><p><button class="btn" onclick="cp('tvm',this)">Salin untuk Excel</button></p><textarea id="tvm" readonly rows="3">${esc(tsv)}</textarea>`:`<p>Belum ada hasil mahasiswa di kuis mana pun untuk mata kuliah ini.</p>`)+`</div>`}
const _dRk5=dRekap;dRekap=function(r,now){return dView==="mk"?dMk():_dRk5(r,now)};
const _dDr5=dDraw;dDraw=function(){_dDr5();
  const b=document.querySelector("#app .bar"),e=b&&Array.from(b.children).find(x=>x.textContent==="Rekap");
  if(e&&!Array.from(b.children).some(x=>x.textContent==="Rekap mata kuliah"))e.insertAdjacentHTML("afterend",`<button class="btn ${dView==="mk"?"on":""}" onclick="dView='mk';dDraw()">Rekap mata kuliah</button>`)};

    return}
  if(!DOSEN&&!ROOMS.length&&!kOk&&useCache()){mergeX([])}
  if(!DOSEN&&!ROOMS.length){bootFail();return}
  rmLock=!DOSEN;setR();document.title=DOSEN?"Dasbor Dosen":ROOM?ROOM.nama+" Quiz":"KuisKuy";if(!DOSEN&&ROOM)pgLoad();DOSEN?dosen():(S.cur?resume():home());pgCheck()});
