<html lang="id">
<head>

<title>Penjaga Data Kesehatan Quiz</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--card:#241447;--ink:#F1EAFF;--mut:#B7A9D9;--pri:#B58CFF;--priT:#1B0C3A;--soft:#33205F;--okB:#17381A;--badB:#431B26;--line:#46327A;color-scheme:dark}}
html,body{margin:0;background:linear-gradient(160deg,var(--bg),var(--bg2));background-attachment:fixed;min-height:100%;color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,sans-serif;font-size:17px;line-height:1.5}
h1,h2,h3{font-family:"Bricolage Grotesque",system-ui,sans-serif;margin:0;line-height:1.15}
main{max-width:640px;margin:0 auto;padding:16px 16px 48px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px;color:#fff}
.pill{background:rgba(255,255,255,.16);border-radius:999px;padding:6px 14px;font-weight:700;white-space:nowrap}

.sp{flex:1}
.card{background:var(--card);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 4px 0 rgba(0,0,0,.18)}

.lv{display:flex;gap:14px;align-items:center;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}

.lv span{display:block;color:var(--mut);font-size:.92rem}
.stars{margin-left:auto;letter-spacing:2px;color:#E8A317;white-space:nowrap;font-weight:700}
.tb{height:12px;background:rgba(255,255,255,.2);border-radius:8px;overflow:hidden}

.ans{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;font-weight:700;color:#fff;border:0;border-radius:12px;padding:16px 14px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.28);transition:transform .08s}
.opt:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.28)}

.c0{background:var(--c0)}.c1{background:var(--c1)}.c2{background:var(--c2)}

.opt.dim{opacity:.3}
.opt.ok{outline:4px solid #fff;box-shadow:0 0 0 7px var(--ok)}
.btn{font:inherit;font-weight:700;background:#fff;color:var(--bg);border:0;border-radius:12px;padding:13px 22px;margin-top:14px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.card .btn{background:var(--pri);color:var(--priT)}
.btn.ghost{background:transparent;color:var(--pri);box-shadow:inset 0 0 0 2px var(--pri)}
.btn.ghost.w{color:#fff;box-shadow:inset 0 0 0 2px #fff}
.opt:focus-visible,.btn:focus-visible,.lv:focus-visible{outline:3px solid #FFD23F;outline-offset:2px}
.res{border-radius:16px;padding:16px;margin-top:12px;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.res.good{background:var(--ok)}.res.no{background:var(--bad)}
.res h3{font-size:1.4rem;margin-bottom:4px}
.res p{margin:4px 0 0}
.res .btn{margin-top:12px}
.lg{background:var(--card);border-radius:16px;padding:12px;margin:12px 0;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.log{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.86rem;display:grid;gap:8px}
.log .opt{background:var(--soft);color:var(--ink);box-shadow:none;font-weight:400;padding:10px 12px}
.log .opt.sel{background:var(--c1);color:#fff;font-weight:700}
.log .opt.ok{background:var(--ok);color:#fff;outline:none;box-shadow:none}
.log .opt.bad{background:var(--bad);color:#fff;outline:none;box-shadow:none}
.big{font-family:"Bricolage Grotesque",sans-serif;font-size:2.6rem;font-weight:800;color:var(--pri)}
.center{text-align:center}
input{display:block;width:100%;box-sizing:border-box;font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:10px;padding:12px;margin-top:10px}
textarea{width:100%;box-sizing:border-box;font:.8rem ui-monospace,Menlo,Consolas,monospace;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:10px;padding:10px;word-break:break-all}
input:focus-visible,textarea:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.tw{overflow-x:auto;margin-top:12px}table{border-collapse:collapse;width:100%;font-size:.9rem}th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;white-space:nowrap}
.card p{color:var(--ink)}
.pop{animation:pop .35s}
@keyframes pop{0%{transform:scale(.8);opacity:0}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.pop{animation:none}.tb i{transition:none}}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px;color:#fff}
.bar h1{font-size:1.5rem;margin-right:auto}
.bar .btn{margin-top:0;padding:9px 16px}
.btn.on,.card .btn.on{background:#FFD23F;color:#1F1F2E}
.live{color:var(--ok);font-weight:700}.mut{color:var(--mut)}
.err{color:#FFB3C0;margin-top:10px}
.lb{display:grid;grid-template-columns:1fr 220px;gap:20px;align-items:start;color:#fff}
.lb h2{font-size:2rem;margin-bottom:12px}
.rw{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;margin-bottom:10px;font-size:1.25rem}
.rw .rk{font-family:"Bricolage Grotesque",sans-serif;font-size:1.6rem;text-align:center}
.rw .tr{height:10px;background:rgba(255,255,255,.2);border-radius:6px;margin-top:4px;overflow:hidden}
.rw .tr i{display:block;height:100%;background:#FFD23F;transition:width .6s}
.rw b{font-family:"Bricolage Grotesque",sans-serif;font-size:1.5rem}
.rw small{opacity:.75;font-size:.8rem;margin-left:8px}
.qb{background:#fff;color:#1F1F2E;border-radius:14px;padding:12px;text-align:center;font-size:.9rem}
.qb svg{width:100%;height:auto}
@media (max-width:700px){.lb{grid-template-columns:1fr}.rw{font-size:1rem}}
</style>
</head>

{q:"Diagnosis penyakit menular dan riwayat pengobatan seorang pasien. Termasuk tingkat apa?",o:["Data pribadi (internal)","Sangat sensitif","Publik"],a:1,e:"Data kesehatan termasuk data pribadi yang spesifik, jadi butuh perlindungan paling tinggi."},

{q:"Staf yang tidak merawat seorang selebritas ikut membuka rekam medisnya karena penasaran. Prinsip CIA apa yang dilanggar?",o:["Integritas","Kerahasiaan","Ketersediaan"],a:1,e:"Data dibuka oleh pihak tanpa kepentingan pelayanan: pelanggaran kerahasiaan."}]},
{n:"Boleh atau Tidak?",d:"Etika, kerahasiaan, dan hak pasien",qs:[

{q:"Seorang pasien meminta ringkasan rekam medis tentang dirinya sendiri. Bagaimana sebaiknya?",o:["Menolak, rekam medis milik fasilitas saja","Melayani sesuai prosedur karena pasien berhak atas informasi tentang dirinya","Menyuruhnya bertanya ke pasien lain"],a:1,e:"Pasien punya hak atas informasi kesehatannya. Fasilitas tetap mengatur caranya lewat prosedur dan verifikasi identitas."},

];
const T=20,TL=60,SH=["▲","◆","●"];
const LMAX=l=>l.log?2000:l.qs.length*1000;
const MAXP=LV.reduce((s,l)=>s+LMAX(l),0);
let S={score:0,done:[],lv:0,qi:0,right:0,pick:[],streak:0,lp:0,base:0,tm:null,playing:false};
const $=id=>document.getElementById(id);
/* ===== Firebase: kirim skor otomatis ke Firestore (aktif jika firebase-config.js sudah diisi) ===== */
let DB=null,AUTHP=null;const DOSEN=location.hash==="#dosen";
function cloudInit(){
  const C=window.FIREBASE_CONFIG;
  if(!C||!C.apiKey||/^GANTI/.test(C.apiKey)||!window.firebase)return;
  try{firebase.initializeApp(C);DB=firebase.firestore();
    if(DOSEN)return;
    const A=firebase.auth();
    AUTHP=new Promise((res,rej)=>{const un=A.onAuthStateChanged(u=>{un();
      if(u&&!u.isAnonymous)A.signOut().then(()=>A.signInAnonymously()).then(res,rej);
      else if(u)res({user:u});else A.signInAnonymously().then(res,rej)})});
    AUTHP.then(()=>cl("conn")).catch(()=>cl("err"))}catch(e){DB=null}
}
function cl(s){const el=$("cl");if(!DB){el.style.display="none";return}el.style.display="";el.textContent=s==="ok"?"☁ Tersimpan":s==="err"?"⚠ Gagal kirim":s==="conn"?"☁ Terhubung":"☁ Mengirim…"}
function total(){if(S.playing){const p=S.done[S.lv];return S.base+Math.max(p?p.pts:0,S.lp)}return myScore()}
function sync(prog){
  if(!DB||!S.nm||!S.nim)return;
  cl("...");
  const d={nama:S.nm.slice(0,60),nim:S.nim.slice(0,30),skor:total(),l:LV.map((_,i)=>S.done[i]?Math.round(S.done[i].acc*100):null),prog:String(prog).slice(0,60),sel:S.done.filter(Boolean).length,t:firebase.firestore.FieldValue.serverTimestamp()};
  AUTHP.then(u=>DB.collection("hasil").doc(u.user.uid).set(d)).then(()=>cl("ok")).catch(()=>cl("err"));
}
const stars=a=>a>=.85?"★★★":a>=.6?"★★☆":"★☆☆";
function hud(){$("sc").textContent=S.score;$("st").style.display=S.streak>=2?"":"none";$("stn").textContent=S.streak}
function stop(){if(S.tm){clearInterval(S.tm);S.tm=null}}
function timer(sec,fn){stop();const t0=Date.now(),b=$("tbar"),w=$("tbox");S.t0=t0;S.tm=setInterval(()=>{const left=Math.max(0,sec-(Date.now()-t0)/1000);b.style.width=(left/sec*100)+"%";w.classList.toggle("low",left<=5);$("tl").textContent=Math.ceil(left);if(left<=0){stop();fn()}},100)}
function tbox(){return `<div class="prog"><span id="pl"></span><span>⏱ <b id="tl"></b></span></div><div class="tb" id="tbox"><i id="tbar"></i></div>`}
function home(){
stop();S.playing=false;S.score=myScore();S.streak=0;hud();
let h=`<div class="hero"><div class="logo">🛡️</div><h1>Penjaga Data Kesehatan</h1><p>Jawab cepat dan tepat. Makin cepat, makin banyak poin!</p></div>`;
h+=nameCard();
LV.forEach((l,i)=>{const d=S.done[i],ok=i===0||S.done[i-1];
h+=`<div class="card"><button class="lv" ${ok?"":"disabled"} onclick="start(${i})"><b>${i+1}</b><div>${l.n}<span>${l.d}</span></div><span class="stars">${d?stars(d.acc):ok?"Main ▶":"🔒"}</span></button></div>`});
if(S.done.filter(Boolean).length===LV.length)h+=`<button class="btn" onclick="fin()">Lihat hasil akhir</button>`;
h+=codeCard()+`<p class="center"><button class="btn ghost w" onclick="rekap()">Rekap dosen</button> <a href="#dosen" style="color:#fff;opacity:.85;margin-left:10px">Dasbor online</a></p>`;
$("app").innerHTML=h}
function start(i){if(!S.nm||!S.nim){const m=$("msg");if(m)m.textContent="Isi nama dan NIM dulu agar skormu bisa dicatat dosen.";return}
S.lv=i;S.qi=0;S.right=0;S.pick=[];S.lp=0;S.streak=0;
S.base=LV.reduce((t,_,k)=>t+(k!==i&&S.done[k]?S.done[k].pts:0),0);S.score=S.base;S.playing=true;hud();sync("Level "+(i+1)+": mulai");LV[i].log?logQ():ques()}
function ques(){
const l=LV[S.lv],q=l.qs[S.qi];
$("app").innerHTML=tbox()+`<div class="q"><h2>${q.q}</h2></div><div class="ans" id="o">${q.o.map((t,i)=>`<button class="opt c${i}" onclick="ans(${i})"><i>${SH[i]}</i><span>${t}</span></button>`).join("")}</div><div id="fb"></div>`;
$("pl").textContent=`Level ${S.lv+1} · Soal ${S.qi+1}/${l.qs.length}`;
timer(T,()=>ans(-1))}
function ans(i){
const left=Math.max(0,T-(Date.now()-S.t0)/1000);stop();
const q=LV[S.lv].qs[S.qi],b=document.querySelectorAll("#o .opt"),ok=i===q.a,to=i===-1;
b.forEach((x,j)=>{x.disabled=true;if(j===q.a)x.classList.add("ok");else x.classList.add("dim")});
let pts=0;
if(ok){pts=Math.round(500+500*left/T);S.lp+=pts;S.right++;S.streak++}else S.streak=0;
S.score=S.base+S.lp;hud();sync(`Level ${S.lv+1}: soal ${S.qi+1}/${LV[S.lv].qs.length}`);
const last=S.qi===LV[S.lv].qs.length-1;
const head=ok?(S.streak>=3?`Tepat! 🔥 Streak ${S.streak}`:"Tepat! ✅"):to?"Waktu habis ⏰":"Belum tepat ❌";
$("fb").innerHTML=`<div class="res pop ${ok?"good":"no"}"><h3>${head}</h3>${ok?`<p><b>+${pts} poin</b></p>`:""}<p>${q.e}</p><button class="btn" onclick="${last?"endLv()":"nextQ()"}">${last?"Selesaikan level":"Lanjut ▶"}</button></div>`;
$("fb").scrollIntoView({behavior:"smooth",block:"nearest"})}
function nextQ(){S.qi++;ques()}
function logQ(){
const l=LV[S.lv];
$("app").innerHTML=tbox()+`<div class="q"><h2>${l.t}</h2></div><div class="lg"><div class="log" id="o">${l.rows.map((r,i)=>`<button class="opt" onclick="tog(${i},this)">${r[0]} ${r[1]}: ${r[2]}</button>`).join("")}</div></div><div id="fb"><button class="btn" id="chk" onclick="chk()">Periksa</button></div>`;
$("pl").textContent=`Level ${S.lv+1} · ${l.n}`;
timer(TL,chk)}
function tog(i,el){if(el.disabled)return;const k=S.pick.indexOf(i);if(k>=0){S.pick.splice(k,1);el.classList.remove("sel")}else{S.pick.push(i);el.classList.add("sel")}}
function chk(){
stop();const l=LV[S.lv];let hit=0,miss=0;
document.querySelectorAll("#o .opt").forEach((b,i)=>{b.disabled=true;b.classList.remove("sel");const s=S.pick.includes(i),t=l.rows[i][3];
if(t&&s){b.classList.add("ok");hit++}else if(t){b.classList.add("bad")}else if(s){b.classList.add("bad");miss++}});
const pts=Math.max(0,hit*500-miss*250);S.lp=pts;S.lgAcc=Math.max(0,hit-miss)/4;S.score=S.base+pts;S.streak=0;hud();sync(`Level ${S.lv+1}: ${l.n}`);
$("fb").innerHTML=`<div class="res pop ${hit>=3&&!miss?"good":"no"}"><h3>Ketemu ${hit} dari 4 (${miss} salah tandai)</h3><p><b>+${pts} poin</b></p><p>${l.e}</p><button class="btn" onclick="endLv()">Selesaikan level</button></div>`;
$("fb").scrollIntoView({behavior:"smooth",block:"nearest"})}
function endLv(){
const l=LV[S.lv],acc=l.log?S.lgAcc:S.right/l.qs.length;
const prev=S.done[S.lv];if(!prev||S.lp>prev.pts)S.done[S.lv]={acc,pts:S.lp};
S.playing=false;S.score=myScore();hud();
sync(S.done.filter(Boolean).length===LV.length?"Selesai semua":`Level ${S.lv+1} selesai`);
const msg=acc>=.85?"Luar biasa, datamu aman di tanganmu.":acc>=.6?"Bagus. Ulangi untuk mengejar bintang penuh.":"Masih ada yang perlu dipelajari. Coba ulangi level ini.";
$("app").innerHTML=`<div class="card center pop"><h2>Level ${S.lv+1} selesai 🎉</h2><div class="big">${stars(acc)}</div><p><b>${S.lp}</b> poin · akurasi ${Math.round(acc*100)}%</p><p>${msg}</p><button class="btn" onclick="home()">Peta level</button> <button class="btn ghost" onclick="start(${S.lv})">Ulangi level</button></div>`}
function fin(){
const p=myScore()/MAXP,t=p>=.8?"Penjaga Data Andal":p>=.55?"Petugas Keamanan Data":"Calon Penjaga Data";
$("app").innerHTML=`<div class="card center pop"><div class="logo">🏆</div><h2>${t}</h2><div class="big">${myScore()} / ${MAXP}</div><p>Kamu menyelesaikan semua level. Bahas soal yang masih keliru dengan dosen atau teman, lalu coba lagi untuk skor lebih tinggi. Kirim kode hasil di bawah ini ke dosen.</p><button class="btn" onclick="home()">Peta level</button></div>${codeCard()}`}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function hs(j){let h=0;for(const c of j)h=(h*31+c.charCodeAt(0))>>>0;return h.toString(36)}
function enc(o){const j=JSON.stringify(o);return "PDK."+btoa(unescape(encodeURIComponent(j)))+"."+hs(j)}
function dec(c){try{const[p,b,h]=c.trim().split(".");const j=decodeURIComponent(escape(atob(b)));if(p!=="PDK"||hs(j)!==h)return null;return JSON.parse(j)}catch(e){return null}}
function myScore(){return LV.reduce((t,_,i)=>t+(S.done[i]?S.done[i].pts:0),0)}
function myCode(){return enc({n:S.nm,i:S.nim,s:myScore(),l:LV.map((_,i)=>S.done[i]?Math.round(S.done[i].acc*100):null),t:Date.now()})}
function nameCard(){return `<div class="card"><h3>Siapa namamu?</h3><input placeholder="Nama lengkap" value="${esc(S.nm||"")}" oninput="S.nm=this.value.trim()"><input placeholder="NIM" inputmode="numeric" value="${esc(S.nim||"")}" oninput="S.nim=this.value.trim()"><div id="msg" style="color:var(--bad);margin-top:8px"></div></div>`}
function codeCard(){if(!S.done.some(Boolean))return "";return `<div class="card"><h3>Kode hasil untuk dosen</h3><p>Salin kode ini dan kirim ke dosen lewat WhatsApp atau email. Kode ikut diperbarui setiap kamu menyelesaikan level.</p><textarea id="mc" readonly rows="4" onclick="this.select()">${myCode()}</textarea><button class="btn" onclick="cp('mc',this)">Salin kode</button></div>`}
function cp(id,b){const t=$(id);t.select();let ok=false;try{ok=document.execCommand("copy")}catch(e){}if(!ok&&navigator.clipboard)navigator.clipboard.writeText(t.value).catch(()=>{});b.textContent="Tersalin"}
function qr(){const u=$("qu").value.trim(),o=$("qr");if(!u){o.innerHTML="";return}
try{const q=qrcode(0,"M");q.addData(u);q.make();o.innerHTML=`<div style="background:#fff;padding:8px;border-radius:12px;width:min(260px,100%);margin:12px auto 0">${q.createSvgTag({cellSize:6,margin:0,scalable:true})}</div><p class="center" style="margin:8px 0 0;font-size:.9rem">Pindai dengan kamera HP</p>`}
catch(e){o.textContent="QR gagal dibuat. Pastikan link benar dan tidak terlalu panjang."}}
function rekap(){const u=/^https?:/.test(location.href)?location.href.split("#")[0]:"";
$("app").innerHTML=`<div class="card"><h3>QR untuk mahasiswa</h3><p>Tampilkan di layar kelas. Mahasiswa memindai dan langsung membuka kuis ini.</p><input id="qu" placeholder="Tempel link kuis yang sudah di-hosting" value="${esc(u)}" oninput="qr()"><div id="qr"></div></div><div class="card"><h2>Rekap dosen</h2><p>Tempel kode hasil mahasiswa, satu kode per baris. Jika satu NIM mengirim beberapa kode, yang skornya tertinggi dipakai.</p><textarea id="in" rows="7" placeholder="PDK.…"></textarea><button class="btn" onclick="tbl()">Tampilkan rekap</button> <button class="btn ghost" onclick="home()">Kembali</button><div id="out"></div></div>`;qr()}
function tbl(){const m={};let bad=0;$("in").value.split(/\s+/).filter(Boolean).forEach(c=>{const d=dec(c);if(!d||!d.i){bad++;return}const k=String(d.i).trim();if(!m[k]||d.s>m[k].s)m[k]=d});
const r=Object.values(m).sort((a,b)=>b.s-a.s),cell=d=>[0,1,2,3].map(i=>(d.l||[])[i]);
const tsv=["Nama\tNIM\tL1\tL2\tL3\tL4\tSkor (maks "+MAXP+")"].concat(r.map(d=>[d.n,d.i,...cell(d).map(x=>x==null?"":x),d.s].join("\t"))).join("\n");
$("out").innerHTML=(r.length?`<div class="tw"><table><tr><th>#</th><th>Nama</th><th>NIM</th><th>L1</th><th>L2</th><th>L3</th><th>L4</th><th>Skor</th></tr>${r.map((d,n)=>`<tr><td>${n<3?["🥇","🥈","🥉"][n]:n+1}</td><td>${esc(d.n)}</td><td>${esc(d.i)}</td>${cell(d).map(x=>`<td>${x==null?"–":x+"%"}</td>`).join("")}<td><b>${d.s}</b></td></tr>`).join("")}</table></div><p>${r.length} mahasiswa. Persen = akurasi tiap level; skor maksimal ${MAXP}.</p><textarea id="tv" readonly rows="4" onclick="this.select()">${esc(tsv)}</textarea><button class="btn" onclick="cp('tv',this)">Salin untuk Excel</button>`:`<p>Belum ada kode yang valid.</p>`)+(bad?`<p style="color:var(--bad)">${bad} kode tidak valid dan dilewati.</p>`:"")}
/* ===== Mode dosen: buka halaman ini dengan #dosen di ujung link ===== */
let dUnsub=null,dDocs=[],dView="rekap",dAnon=false,dMsg="";
const JOIN=location.href.split("#")[0],MAXD=17000;
addEventListener("hashchange",()=>location.reload());
function dosen(){
  document.querySelector("main").style.maxWidth="1000px";document.querySelector(".top").style.display="none";
  if(!DB){$("app").innerHTML='<div class="card"><p>Isi konfigurasi Firebase di bagian atas file ini terlebih dahulu.</p></div>';return}
  const A=firebase.auth();
  A.onAuthStateChanged(u=>{if(u)dListen();else{dStop();A.signInAnonymously().catch(e=>{dMsg="Login anonim gagal: "+e.code;dLogin()})}});
}
function dStop(){if(dUnsub){dUnsub();dUnsub=null}dDocs=[]}
function dLogin(){$("app").innerHTML=`<div class="card" style="max-width:420px;margin:40px auto"><h2>Dasbor Dosen</h2><p>Masukkan PIN dosen untuk membuka rekap dan papan peringkat.</p><input id="pin" type="password" placeholder="PIN dosen" autocomplete="off" onkeydown="if(event.key==='Enter')dPin()"><button class="btn" onclick="dPin()">Buka dasbor</button><p style="color:var(--bad)">${esc(dMsg)}</p><p><a href="#" style="color:var(--pri)">← Kembali ke kuis</a></p></div>`}
async function dPin(){const v=$("pin").value.trim(),u=firebase.auth().currentUser;if(!v||!u)return;
  try{await DB.collection("dosen").doc(u.uid).set({pin:v});dMsg="";dListen()}catch(e){dMsg="PIN salah atau belum diatur di Firestore.";dLogin()}}
function dListen(){dStop();dMsg="";dUnsub=DB.collection("hasil").onSnapshot(s=>{dDocs=s.docs.map(d=>({id:d.id,...d.data()}));dMsg="";dDraw()},e=>{dStop();if(e.code==="permission-denied")dLogin();else{dMsg="Gagal membaca data: "+e.code;dDraw()}});dDraw()}
function dMs(t){return t&&t.toMillis?t.toMillis():Date.now()}
function dMerge(){const m={};
  dDocs.forEach(d=>{const k=String(d.nim||"").trim();if(!k)return;
    const o=m[k]||(m[k]={nama:d.nama,nim:k,skor:-1,l:[null,null,null,null],prog:"",t:0});
    if(d.skor>o.skor){o.skor=d.skor;o.nama=d.nama}
    (d.l||[]).forEach((x,i)=>{if(x!=null&&(o.l[i]==null||x>o.l[i]))o.l[i]=x});
    const t=dMs(d.t);if(t>=o.t){o.t=t;o.prog=d.prog}});
  return Object.values(m).sort((a,b)=>b.skor-a.skor)}
function dIni(n){return String(n).split(/\s+/).filter(Boolean).map(w=>w[0]).join("").toUpperCase().slice(0,4)}
function dQr(){try{const q=qrcode(0,"M");q.addData(JOIN);q.make();return q.createSvgTag({cellSize:6,margin:0,scalable:true})}catch(e){return ""}}
function dDraw(){const r=dMerge(),now=Date.now();
  let h=`<div class="bar"><h1>🛡️ Dasbor Dosen</h1><button class="btn ${dView==="rekap"?"on":""}" onclick="dView='rekap';dDraw()">Rekap</button><button class="btn ${dView==="board"?"on":""}" onclick="dView='board';dDraw()">Papan peringkat</button>`;
  if(dView==="board")h+=`<button class="btn ghost w" onclick="dAnon=!dAnon;dDraw()">${dAnon?"Tampilkan nama":"Samarkan nama"}</button><button class="btn ghost w" onclick="document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()">Layar penuh</button>`;
  h+=`<button class="btn ghost w" onclick="firebase.auth().signOut()">Keluar</button></div>`;
  if(dMsg)h+=`<p class="err">${esc(dMsg)}</p>`;
  $("app").innerHTML=h+(dView==="board"?dBoard(r):dRekap(r,now))}
function dRekap(r,now){
  const tsv=["Nama\tNIM\tL1\tL2\tL3\tL4\tSkor (maks "+MAXD+")"].concat(r.map(d=>[d.nama,d.nim,...d.l.map(x=>x==null?"":x),d.skor].join("\t"))).join("\n");
  return `<div class="card"><h2>Rekap (${r.length} mahasiswa)</h2><p class="mut">Diperbarui otomatis. Satu NIM dihitung sekali dengan skor tertinggi. Persen = akurasi tiap level.</p>`+
  (r.length?`<div class="tw"><table><tr><th>#</th><th>Nama</th><th>NIM</th><th>L1</th><th>L2</th><th>L3</th><th>L4</th><th>Skor</th><th>Status</th></tr>${r.map((d,i)=>`<tr><td>${i+1}</td><td>${esc(d.nama)}</td><td>${esc(d.nim)}</td>${d.l.map(x=>`<td>${x==null?"–":x+"%"}</td>`).join("")}<td><b>${d.skor}</b></td><td>${now-d.t<60000?'<span class="live">● aktif</span> ':''}<span class="mut">${esc(d.prog)}</span></td></tr>`).join("")}</table></div><p><button class="btn" onclick="cp('tv',this)">Salin untuk Excel</button> <button class="btn ghost" style="color:var(--bad);box-shadow:inset 0 0 0 2px var(--bad)" onclick="dReset()">Reset sesi</button></p><textarea id="tv" readonly rows="3">${esc(tsv)}</textarea>`:`<p>Belum ada mahasiswa yang mengirim skor.</p>`)+`</div>`}
function dBoard(r){const top=r.slice(0,10),mx=Math.max(top[0]?top[0].skor:1,1);
  return `<div class="lb"><div><h2>Papan Peringkat</h2>${top.length?top.map((d,i)=>`<div class="rw"><div class="rk">${i<3?["🥇","🥈","🥉"][i]:i+1}</div><div>${esc(dAnon?dIni(d.nama):d.nama)}<small>${d.l.filter(x=>x!=null).length}/4 level</small><div class="tr"><i style="width:${d.skor/mx*100}%"></i></div></div><b>${d.skor}</b></div>`).join(""):'<p style="opacity:.8">Menunggu mahasiswa bergabung…</p>'}</div><div class="qb"><b>Gabung kuis</b>${dQr()}<div style="word-break:break-all">${esc(JOIN)}</div><div class="mut">${r.length} peserta</div></div></div>`}
async function dReset(){if(!confirm("Hapus SEMUA hasil mahasiswa? Tindakan ini tidak bisa dibatalkan."))return;
  const ids=dDocs.map(d=>d.id);for(let i=0;i<ids.length;i+=400){const b=DB.batch();ids.slice(i,i+400).forEach(id=>b.delete(DB.collection("hasil").doc(id)));await b.commit()}}
setInterval(()=>{if(DOSEN&&dView==="rekap"&&dDocs.length)dDraw()},30000);
cloudInit();DOSEN?dosen():home();
</script>
</body>
</html>
