<style>

html,body{margin:0;background:linear-gradient(160deg,var(--bg),var(--bg2));background-attachment:fixed;min-height:100%;color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,sans-serif;font-size:17px;line-height:1.5}

.rv-f{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.rb{display:inline-block;height:8px;background:var(--c0);border-radius:4px;vertical-align:middle;margin:0 6px}.rb.ok{background:var(--ok)}
.ed textarea{font:inherit;word-break:normal;min-height:72px;margin-top:10px}

/* ===== Halaman awal animasi KuisKuy ===== */
.ks{position:relative;min-height:72vh;display:grid;place-items:center;text-align:center;color:#fff;overflow:hidden}
.ks-bg{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.ks-bg span{position:absolute;bottom:-12%;left:var(--x);font-size:var(--s);opacity:0;color:#fff;animation:ksUp var(--dur) linear var(--d) infinite}
@keyframes ksUp{0%{transform:translateY(0) rotate(0);opacity:0}12%{opacity:.22}88%{opacity:.22}100%{transform:translateY(-95vh) rotate(300deg);opacity:0}}
.ks-c{position:relative;z-index:1;padding:24px 8px}
.ks-t{display:flex;justify-content:center;gap:6px;margin:0 0 14px}
.ks-t b{display:grid;place-items:center;width:clamp(40px,11.5vw,56px);height:clamp(48px,13.5vw,66px);border-radius:12px;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:clamp(1.7rem,7vw,2.4rem);font-weight:800;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.28);opacity:0;animation:ksDrop .7s cubic-bezier(.3,1.5,.5,1) calc(var(--i)*.09s + .15s) forwards,ksWave 2.6s ease-in-out calc(var(--i)*.14s + 1.2s) infinite}
.ks-t b:nth-child(4n+1){background:var(--c0)}.ks-t b:nth-child(4n+2){background:var(--c1)}.ks-t b:nth-child(4n+3){background:var(--c2)}.ks-t b:nth-child(4n+4){background:var(--ok)}
@keyframes ksDrop{0%{transform:translateY(-120px) rotate(-18deg) scale(.6);opacity:0}100%{transform:none;opacity:1}}
@keyframes ksWave{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px) rotate(-2deg)}}
.ks-sh{display:flex;justify-content:center;gap:16px;font-size:2rem;margin-bottom:18px;animation:ksFade .6s ease .1s both}
.ks-sh i{font-style:normal;display:inline-block;animation:ksSpin 3.2s ease-in-out infinite}
.ks-sh i:nth-child(1){color:#FF5A6E}.ks-sh i:nth-child(2){color:#5AA2FF;animation-delay:.25s}.ks-sh i:nth-child(3){color:#FFD23F;animation-delay:.5s}
@keyframes ksSpin{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.35) rotate(180deg)}}
.ks-s{font-size:1.15rem;margin:0 0 22px;animation:ksFade .8s ease 1.1s both}
.ks-card{display:inline-block;max-width:360px;background:rgba(255,255,255,.14);border-radius:16px;padding:14px 18px;animation:ksFade .8s ease 1.5s both,ksPulse 2.4s ease-in-out 2.4s infinite}
.ks-card span{font-size:1.6rem;display:block;margin-bottom:4px}
.ks-dots{display:flex;justify-content:center;gap:8px;margin-top:22px;animation:ksFade .6s ease 1.9s both}
.ks-dots i{width:10px;height:10px;border-radius:50%;background:#FFD23F;animation:ksDot 1.2s ease-in-out infinite}
.ks-dots i:nth-child(2){animation-delay:.2s}.ks-dots i:nth-child(3){animation-delay:.4s}
@keyframes ksDot{0%,80%,100%{transform:scale(.6);opacity:.5}40%{transform:scale(1.2);opacity:1}}
@keyframes ksFade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes ksPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.35)}50%{box-shadow:0 0 0 12px rgba(255,255,255,0)}}

/* ===== Animasi tambahan halaman awal ===== */
.ks::before{content:"";position:absolute;inset:-20%;background:radial-gradient(circle at 25% 30%,rgba(226,27,60,.35),transparent 40%),radial-gradient(circle at 75% 25%,rgba(19,104,206,.4),transparent 42%),radial-gradient(circle at 55% 80%,rgba(216,158,0,.3),transparent 40%);filter:blur(30px);animation:ksAur 12s ease-in-out infinite alternate;pointer-events:none}
@keyframes ksAur{0%{transform:translate(-4%,-3%) rotate(0) scale(1)}100%{transform:translate(4%,3%) rotate(14deg) scale(1.15)}}
.ks-cf{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:2}
.ks-cf i{position:absolute;top:-24px;left:var(--x);width:var(--w);height:calc(var(--w)*1.5);background:var(--c);border-radius:2px;opacity:0;animation:ksCf var(--t) cubic-bezier(.3,.6,.5,1) var(--d) forwards}
@keyframes ksCf{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(95vh) translateX(var(--dx)) rotate(var(--r));opacity:0}}
.ks-st{position:absolute;inset:0;pointer-events:none}
.ks-st em{position:absolute;left:var(--x);top:var(--y);font-style:normal;font-size:var(--s);animation:ksTw 2.2s ease-in-out var(--d) infinite}
@keyframes ksTw{0%,100%{transform:scale(.4) rotate(0);opacity:.1}50%{transform:scale(1) rotate(90deg);opacity:.9}}
.ks-t b{cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none}
.ks-t b.hop{animation:ksHop .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes ksHop{0%{transform:none}35%{transform:translateY(-36px) rotate(-14deg) scale(1.2)}100%{transform:none}}
.ks-s{background:linear-gradient(90deg,#fff 0%,#FFD23F 25%,#fff 50%,#FFD23F 75%,#fff 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:ksFade .8s ease 1.1s both,ksSh 3.5s linear 2s infinite}
@keyframes ksSh{to{background-position:-200% 0}}
.ks-bar{width:min(220px,60%);height:8px;margin:18px auto 0;border-radius:6px;background:rgba(255,255,255,.18);overflow:hidden;animation:ksFade .6s ease 1.9s both}
.ks-bar i{display:block;height:100%;width:40%;border-radius:6px;background:linear-gradient(90deg,#E21B3C,#FFD23F,#26890C);animation:ksSlide 1.6s ease-in-out infinite}
@keyframes ksSlide{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
.ks-hint{font-size:.85rem;opacity:.75;margin-top:14px;animation:ksFade .8s ease 2.3s both}
.ks-go{display:inline-block;text-decoration:none;margin-top:18px;animation:ksFade .6s ease both,ksPulse 2.4s ease-in-out .6s infinite}
.ks-dev{text-align:center;color:#fff;opacity:.8;font-size:.9rem;margin:6px 0 0;animation:ksFade .8s ease 2.3s both}
.ks-dev a{color:#FFD23F;font-weight:700;text-decoration:none}.ks-dev a:hover,.ks-dev a:focus-visible{text-decoration:underline}
</style>

<script>

<script>
/* ===== Data kamar, materi, level, dan soal TIDAK ada di file ini =====
   Semuanya dibaca dari Firestore koleksi "kamar" (satu dokumen per mata kuliah).
   Isi pertama kali: Dasbor dosen > Bank soal > Impor data kamar > pilih data-bawaan.json. */
const ROOMS=[];
let kOk=false,kErr="",rmLock=false;
function kRooms(docs){const out=[];docs.forEach(d=>{const x=d.data?d.data():d;
  try{const r={id:d.id,nama:x.nama,ikon:x.ikon||"📘",ket:x.ket||"",sub:x.sub||"",ranks:x.ranks||["Juara Kuis","Peserta Andal","Terus Berlatih"],mat:JSON.parse(x.mat||"[]"),lv:JSON.parse(x.lv||"[]"),u:x.urut||0};
    if(r.nama&&Array.isArray(r.lv)&&r.lv.length)out.push(r)}catch(e){}});
  return out.sort((a,b)=>a.u-b.u)}
function useCache(){try{const c=JSON.parse(localStorage.getItem("kamar_cache"));if(Array.isArray(c)&&c.length){ROOMS.length=0;ROOMS.push(...c);return true}}catch(e){}return false}
/* ===== Fitur review jawaban + penjelasan materi ===== */
const rvKey=()=>"rv_"+ROOM.id;
function rvGet(){try{return JSON.parse(localStorage.getItem(rvKey()))||{}}catch(e){return{}}}
function rvSet(lv,a){const o=rvGet();o[lv]=a;try{localStorage.setItem(rvKey(),JSON.stringify(o))}catch(e){}}
const rvStop=new Set("pasien dengan untuk adalah tidak dalam rumah sakit manakah berikut paling sebuah sebagai bukan lebih kalau karena jawaban yang".split(" "));
const rvTok=s=>(String(s).replace(/<[^>]+>/g," ").toLowerCase().match(/[a-z0-9]{5,}/g)||[]).filter(w=>!rvStop.has(w));
function rvMat(txt,rm){rm=rm||ROOM;let b=null,bs=2;const w=new Set(rvTok(txt));(rm.mat||[]).forEach(m=>{const t=new Set(rvTok(m.h)),j=new Set(rvTok(m.j));let s=0;w.forEach(x=>{if(t.has(x))s++;if(j.has(x))s+=3});if(s>bs){bs=s;b=m}});
return b?`<details><summary>📖 Penjelasan materi: ${b.j}</summary><div class="mt">${b.h}</div></details>`:""}
function review(lv,only){
stop();S.playing=false;const l=LV[lv],a=rvGet()[lv];if(!a){home();return}
let items="",head="";
if(l.log){let hit=0,miss=0;
l.rows.forEach((r,i)=>{const s=a.includes(i),t=!!r[3];if(t&&s)hit++;else if(s)miss++;
const ok=t===s,ic=t&&s?"✅":t?"❌":s?"⚠️":"▫️",nt=t&&s?"Benar: mencurigakan dan kamu menandainya.":t?"Terlewat: baris ini mencurigakan.":s?"Salah tandai: baris ini normal.":"Tepat: normal dan tidak kamu tandai.";
if(only&&ok)return;items+=`<div class="rq ${ok?"":"no"}"><b>${ic}</b> ${r[0]} ${r[1]}: ${r[2]}<div class="a">${nt}</div></div>`});
head=`Ketemu ${hit} dari 4 baris mencurigakan, ${miss} salah tandai.`;items+=`<p>${l.e}</p>`+rvMat(l.t+" "+l.e)}
else{let n=0;
l.qs.forEach((q,i)=>{const p=a[i]==null?-1:a[i],ok=p===q.a;if(ok)n++;if(only&&ok)return;

/* ===== Level puzzle: pasangkan istilah, urutkan langkah, susun kata ===== */
const PZ={match:["🧩","Pasangkan istilah"],order:["🔢","Urutkan langkah"],word:["🔤","Susun kata"]},PT=90;
let P={};
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function pzStart(){const l=LV[S.lv],n=l.items.length,ix=l.items.map((_,i)=>i);
  P={g:l.g,n,err:0,done:0,sel:-1,seq:[],m:{},w:0,got:0,msg:""};
  let s=shuf(ix);if(n>1&&s.every((v,i)=>v===i))s=s.reverse();P.pool=s;P.ds=s;
  if(l.g==="word")pzW();pzDraw();timer(PT,pzFin)}
function pzW(){const a=String(LV[S.lv].items[P.w][1]).toUpperCase().split("");let s=shuf(a);if(a.length>1&&s.join("")===a.join(""))s.reverse();P.ls=s;P.cur=[];P.e1=0}
function pzDraw(){const l=LV[S.lv],it=l.items,g=l.g;let b="";
  if(g==="match")b=`<div class="pz"><div>${it.map((p,i)=>`<button class="opt ${P.m[i]?"ok":P.sel===i?"sel":""}" ${P.m[i]?"disabled":""} onclick="pzT(${i})">${esc(p[0])}</button>`).join("")}</div><div>${P.ds.map(i=>`<button class="opt ${P.m[i]?"ok":""}" ${P.m[i]?"disabled":""} onclick="pzD(${i})">${esc(it[i][1])}</button>`).join("")}</div></div>`;
  else if(g==="order")b=`<div class="card"><b>Urutan kamu</b>${P.seq.length?"":'<p class="mut">Ketuk langkah di bawah sesuai urutan. Ketuk lagi untuk membatalkan.</p>'}${P.seq.map((i,k)=>`<button class="opt sel" onclick="pzU(${k})"><i>${k+1}</i><span>${esc(it[i])}</span></button>`).join("")}</div>${P.pool.filter(i=>!P.seq.includes(i)).map(i=>`<button class="opt" onclick="pzA(${i})">${esc(it[i])}</button>`).join("")}${P.seq.length===P.n?`<button class="btn" onclick="pzFin()">Periksa</button>`:""}`;
  else b=`<div class="card center"><p>Kata ${P.w+1}/${P.n}: ${esc(it[P.w][0])}</p><div class="big">${P.cur.map(k=>esc(P.ls[k])).join(" ")||"…"}</div></div><div class="tiles">${P.ls.map((c,k)=>`<button class="opt" ${P.cur.includes(k)?"disabled":""} onclick="pzL(${k})">${esc(c)}</button>`).join("")}</div><div class="bar"><button class="btn ghost" onclick="P.cur.pop();pzDraw()">⌫ Hapus</button><span class="sp"></span><button class="btn ghost" onclick="pzNx(0)">Lewati</button></div>`;
  const t=g==="match"?"Ketuk istilah di kiri, lalu pasangannya di kanan.":g==="order"?(l.t||"Urutkan langkah berikut dengan benar."):"Susun huruf menjadi kata yang sesuai petunjuk.";
  $("app").innerHTML=tbox()+`<div class="q"><h2>${esc(t)}</h2></div><p class="center" style="color:#fff;min-height:1.4em">${esc(P.msg)}</p><div class="pzw">${b}</div><div id="fb"></div>`;
  $("pl").textContent=`Level ${S.lv+1} · ${PZ[g]?PZ[g][1]:"Puzzle"}`;P.msg=""}
function pzT(i){P.sel=P.sel===i?-1:i;pzDraw()}
function pzD(i){if(P.sel<0)return;if(P.sel===i){P.m[i]=1;P.done++;P.sel=-1;pzDraw();if(P.done===P.n)pzFin();return}P.err++;P.sel=-1;P.msg="Belum cocok, coba lagi.";pzDraw()}
function pzA(i){P.seq.push(i);pzDraw()}
function pzU(k){P.seq.splice(k,1);pzDraw()}
function pzL(k){P.cur.push(k);if(P.cur.length<P.ls.length){pzDraw();return}
  const a=String(LV[S.lv].items[P.w][1]).toUpperCase();if(P.cur.map(x=>P.ls[x]).join("")===a)pzNx(P.e1?.5:1);else{P.e1=1;P.err++;P.cur=[];P.msg="Belum tepat, coba lagi.";pzDraw()}}
function pzNx(c){P.got+=c;P.w++;if(P.w>=P.n)return pzFin();pzW();pzDraw()}
function pzFin(){if(P.fin)return;P.fin=1;const l=LV[S.lv],it=l.items,left=Math.max(0,PT-(Date.now()-S.t0)/1000);stop();
  const acc=l.g==="match"?P.done/(P.n+P.err):l.g==="order"?P.seq.filter((v,k)=>v===k).length/P.n:Math.min(1,P.got/P.n),
  pts=Math.round(acc*(700+300*left/PT)),ans=l.g==="order"?"<ol>"+it.map(x=>"<li>"+esc(x)+"</li>").join("")+"</ol>":l.g==="word"?"<p>"+it.map(p=>esc(String(p[1]).toUpperCase())).join(", ")+"</p>":"";
  S.lp=pts;S.lgAcc=acc;S.score=S.base+pts;S.streak=0;hud();pgSave(cur(0,0,1));sync(`Level ${S.lv+1}: puzzle`);
  $("app").innerHTML=`<div class="card center pop"><h2>${acc>=.99?"Sempurna! 🎉":acc>=.6?"Bagus!":"Hampir"}</h2><p><b>+${pts} poin</b> · akurasi ${Math.round(acc*100)}%</p>${ans?`<div style="text-align:left"><p class="mut">Jawaban yang benar:</p>${ans}</div>`:""}<button class="btn" onclick="endLv()">Selesaikan level</button></div>`}

function pzClose(){pz.open=false;pz.msg="";pzGo()}
function pzType(v){pzSnap();pz.g=v;pzGo()}
const PZH={match:"Satu pasangan per baris, format: istilah | definisi (3 sampai 6 baris).",order:"Satu langkah per baris, tulis dalam urutan yang benar (3 sampai 8 baris). Urutan diacak untuk mahasiswa.",word:"Satu kata per baris, format: petunjuk | KATA (3 sampai 12 huruf, tanpa spasi, 3 sampai 6 baris)."};
function pzCard(rm){
  if(!pz.open)return `<div class="card ed"><b>Level puzzle</b><p class="mut">Tambah level berbentuk game: pasangkan istilah, urutkan langkah, atau susun kata.</p>${pz.msg?`<p class="live">${esc(pz.msg)}</p>`:""}<button class="btn" onclick="pzOpen()">+ Level puzzle</button></div>`;
  return `<div class="card ed" id="pzform"><b>Level puzzle baru (level ke-${rm.lv.length+1})</b><select id="pzs" onchange="pzType(this.value)" aria-label="Jenis puzzle">${Object.keys(PZ).map(k=>`<option value="${k}" ${pz.g===k?"selected":""}>${PZ[k][0]} ${PZ[k][1]}</option>`).join("")}</select><input id="pzn" placeholder="Nama level" value="${esc(pz.n)}"><input id="pzd" placeholder="Deskripsi singkat (opsional)" value="${esc(pz.d)}"><p class="mut">${PZH[pz.g]}</p><textarea id="pzt" rows="7">${esc(pz.t)}</textarea>${pz.msg?`<p style="color:var(--bad);font-weight:700">${esc(pz.msg)}</p>`:""}<button class="btn" onclick="pzSave()" ${pz.busy?"disabled":""}>Simpan level</button> <button class="btn ghost" onclick="pzClose()">Batal</button></div>`}
async function pzSave(){pzSnap();if(pz.busy)return;const rm=RM(),g=pz.g,bad=m=>{pz.msg=m;pzGo()};
  if(!pz.n.trim())return bad("Nama level tidak boleh kosong.");
  if(rm.lv.length>=8)return bad("Kamar ini sudah punya 8 level, batas maksimal.");
  const ln=pz.t.split("\n").map(s=>s.trim()).filter(Boolean);let items;
  if(g==="order"){items=ln;if(items.length<3||items.length>8)return bad("Tulis 3 sampai 8 langkah.");if(new Set(items.map(s=>s.toLowerCase())).size!==items.length)return bad("Langkah tidak boleh sama.")}
  else{items=ln.map(s=>s.split("|").map(x=>x.trim()));
    if(items.length<3||items.length>6)return bad("Tulis 3 sampai 6 baris.");
    if(items.some(p=>p.length!==2||!p[0]||!p[1]))return bad("Setiap baris harus berformat: kiri | kanan.");
    if(g==="word"&&items.some(p=>!/^[A-Za-z0-9]{3,12}$/.test(p[1])))return bad("Kata harus 3 sampai 12 huruf atau angka, tanpa spasi.")}
  const lvl={n:esc(PZ[g][0]+" "+pz.n.trim()),d:esc(pz.d.trim()||PZ[g][1]),g,items},old=rm.lv.filter(l=>l.x).map(({x,...l})=>l);
  pz.busy=true;
  try{await DB.collection("soal").doc(dRoom).set({lv:JSON.stringify(old.concat([lvl])),t:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});
    await loadX(true);pz.busy=false;pz.open=false;pz.n=pz.d=pz.t="";pz.msg="Level puzzle tersimpan. Mahasiswa melihatnya setelah memuat ulang halaman.";bk.lv=Math.max(0,RM().lv.length-1);pzGo()}
  catch(e){pz.busy=false;bad(e&&e.code==="permission-denied"?"Firestore menolak penyimpanan. Pasang aturan koleksi soal.":"Gagal menyimpan: "+((e&&e.code)||"koneksi"))}}
function lvCard(l,gi){return `<div class="card ed"><b>Level ${gi+1}: ${l.h?"🙈 Disembunyikan dari mahasiswa":"✅ Dirilis"}</b><p class="mut">${l.h?"Level ini tidak tampil di peta level mahasiswa dan tidak dihitung dalam skor maksimal. Nomor level dan kolom rekap tidak bergeser.":"Sembunyikan jika level belum siap dipakai. Nomor level dan kolom rekap tidak bergeser."}</p><button class="btn ghost" onclick="lvHide()">${l.h?"Rilis ke mahasiswa":"Sembunyikan dari mahasiswa"}</button></div>`}
function lvHide(){const rm=RM(),gi=bkGi(),l=rm.lv[gi];if(!l.h&&rm.lv.filter(x=>!x.h).length<2)return bkMsg("Minimal satu level harus tetap tampil untuk mahasiswa.",1);
  bkPersist(gi,L=>{if(L.h)delete L.h;else L.h=1},l.h?"Level dirilis. Mahasiswa melihatnya setelah memuat ulang halaman.":"Level disembunyikan. Mahasiswa tidak melihatnya setelah memuat ulang halaman.")}
const _dBk=dBank;dBank=function(){const rm=RM();if(!rm||!DB)return _dBk();const gi=bkGi(),l=rm.lv[gi],c=(l?lvCard(l,gi):"")+pzCard(rm);
  if(l&&l.g)return `<div class="card ed" id="bkroot"><h2>${esc(rm.nama)}: bank soal</h2><div class="rv-f">${rm.lv.map((x,i)=>`<button class="btn ${i===gi?"":"ghost"}" onclick="bkPick(${i})">L${i+1}${x.h?" 🙈":""}</button>`).join("")}</div>${bk.msg?`<p class="${bk.bad?"":"live"}" style="${bk.bad?"color:var(--bad);font-weight:700":""}">${esc(bk.msg)}</p>`:""}<p><b>${l.n}</b> · ${PZ[l.g]?PZ[l.g][1]:"Puzzle"}, ${l.items.length} item</p>${l.items.map((x,i)=>`<div class="rq"><b>${i+1}.</b> ${Array.isArray(x)?esc(x[0])+" → "+esc(x[1]):esc(x)}</div>`).join("")}<button class="btn ghost" onclick="bkDelLv()">Hapus level</button></div>`+c;
  return _dBk()+c};

if(!DOSEN&&!ROOM_ID)pick();
cloudInit();loadX().then(()=>{
  if(!DOSEN&&!ROOM_ID){if(!ROOMS.length&&useCache())mergeX([]);
    const c=document.querySelector(".ks-c");
    if(c&&ROOMS.length===1)c.insertAdjacentHTML("beforeend",`<a class="btn ks-go" href="?kamar=${encodeURIComponent(ROOMS[0].id)}">Mulai kuis ▶</a>`);
    return}
  if(!DOSEN&&!ROOMS.length&&!kOk&&useCache()){mergeX([])}
  if(!DOSEN&&!ROOMS.length){bootFail();return}
  rmLock=!DOSEN;setR();document.title=DOSEN?"Dasbor Dosen":ROOM?ROOM.nama+" Quiz":"KuisKuy";if(!DOSEN&&ROOM)pgLoad();DOSEN?dosen():(S.cur?resume():home());pgCheck()});
</script>
</body>
</html>
